name: Product launch
variables:
    fixed cost: 4000000
    margin: 50
    sales high: 200000
    sales low: 20000
    P(high): 0.4
    test cost: 300000
    P(pos|high): 0.85
    P(pos|low): 0.2
    P(pos): P(pos|high) * P(high) + P(pos|low) * (1 - P(high))
    P(high|pos): P(pos|high) * P(high) / P(pos)
    P(high|neg): (1 - P(pos|high)) * P(high) / (1 - P(pos))
type: decision
Launch now:
    tree: launch
Test market first:
    cost: test cost
    tree: test market
Do not launch:
    payoff: 0
